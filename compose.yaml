services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      IMAGE_DIR: /app/images
      LOG_DIR: /app/logs
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: images_db
      DB_USER: postgres
      DB_PASSWORD: password
    volumes:
      - ./images:/app/images
      - ./logs:/app/logs
      - ./backups:/app/backups
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: images_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5533:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d images_db"]
      interval: 3s
      timeout: 3s
      retries: 10

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app

volumes:
  db_data:
